# version: '3.8'  # Docker Compose v2 不再需要 version 字段

services:
  # ============================================
  # MySQL 数据库服务
  # ============================================
  mysql:
    image: mysql:5.7
    container_name: spx-knowledge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spx_knowledge}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - spx-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO 对象存储服务
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: spx-knowledge-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION_NAME: ${MINIO_REGION_NAME:-us-east-1}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - spx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================
  # Redis 缓存服务
  # ============================================
  redis:
    image: redis:6-alpine
    container_name: spx-knowledge-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - spx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # OpenSearch 搜索引擎服务
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: spx-knowledge-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_TRANSPORT_PORT:-9300}:9300"
    networks:
      - spx-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    # 注意: IK插件需要在容器启动后手动安装
    # 执行命令: bin/opensearch-plugin install -b https://github.com/medcl/elasticsearch-analysis-ik/releases/download/v8.11.0/elasticsearch-analysis-ik-8.11.0.zip

  # ============================================
  # OpenSearch Dashboards (可选)
  # ============================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: spx-knowledge-opensearch-dashboards
    restart: always
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    volumes:
      - opensearch_dashboards_data:/usr/share/opensearch-dashboards/data
    depends_on:
      - opensearch
    networks:
      - spx-network

  # ============================================
  # NebulaGraph 图数据库服务
  # ============================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: spx-knowledge-nebula-metad
    restart: always
    environment:
      - USER=root
    ports:
      - "${NEBULA_METAD_PORT:-9559}:9559"
      - "${NEBULA_METAD_HTTP_PORT:-19559}:19559"
    volumes:
      - nebula_metad_data:/data/meta
      - nebula_metad_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --log_dir=/logs
      - --v=0
      - --daemonize=false
      - --containerized=true
    networks:
      - spx-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9559' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: spx-knowledge-nebula-storaged
    restart: always
    environment:
      - USER=root
    ports:
      - "${NEBULA_STORAGED_PORT:-9779}:9779"
      - "${NEBULA_STORAGED_HTTP_PORT:-19779}:19779"
    volumes:
      - nebula_storaged_data:/data/storage
      - nebula_storaged_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --log_dir=/logs
      - --v=0
      - --daemonize=false
      - --containerized=true
    depends_on:
      - nebula-metad
    networks:
      - spx-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9779' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: spx-knowledge-nebula-graphd
    restart: always
    environment:
      - USER=root
    ports:
      - "${NEBULA_GRAPHD_PORT:-9669}:9669"
      - "${NEBULA_GRAPHD_HTTP_PORT:-19669}:19669"
    volumes:
      - nebula_graphd_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --daemonize=false
      - --containerized=true
    depends_on:
      - nebula-metad
      - nebula-storaged
    networks:
      - spx-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9669' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  spx-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  opensearch_dashboards_data:
    driver: local
  nebula_metad_data:
    driver: local
  nebula_metad_logs:
    driver: local
  nebula_storaged_data:
    driver: local
  nebula_storaged_logs:
    driver: local
  nebula_graphd_logs:
    driver: local
