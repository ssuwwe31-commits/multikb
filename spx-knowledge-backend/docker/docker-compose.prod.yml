# Docker Compose for Production

version: '3.8'

services:
  # FastAPI应用
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/spx_knowledge
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
      - opensearch
      - minio
      - ollama
    networks:
      - spx-network
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=spx_knowledge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spx-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spx-network
    restart: unless-stopped

  # OpenSearch搜索引擎
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - spx-network
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - spx-network
    restart: unless-stopped

  # Ollama LLM服务
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - spx-network
    restart: unless-stopped

  # ============================================
  # NebulaGraph 图数据库服务
  # ============================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: spx-knowledge-nebula-metad
    restart: unless-stopped
    environment:
      - USER=root
    ports:
      - "${NEBULA_METAD_PORT:-9559}:9559"
      - "${NEBULA_METAD_HTTP_PORT:-19559}:19559"
    volumes:
      - nebula_metad_data:/data/meta
      - nebula_metad_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    networks:
      - spx-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9559' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: spx-knowledge-nebula-storaged
    restart: unless-stopped
    environment:
      - USER=root
    ports:
      - "${NEBULA_STORAGED_PORT:-9779}:9779"
      - "${NEBULA_STORAGED_HTTP_PORT:-19779}:19779"
    volumes:
      - nebula_storaged_data:/data/storage
      - nebula_storaged_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
    networks:
      - spx-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9779' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: spx-knowledge-nebula-graphd
    restart: unless-stopped
    environment:
      - USER=root
    ports:
      - "${NEBULA_GRAPHD_PORT:-9669}:9669"
      - "${NEBULA_GRAPHD_HTTP_PORT:-19669}:19669"
    volumes:
      - nebula_graphd_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
      nebula-storaged:
        condition: service_healthy
    networks:
      - spx-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9669' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/spx_knowledge
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_NEBULA_GRAPH=true
      - NEBULA_HOSTS=["nebula-graphd:9669"]
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
      - opensearch
      - minio
      - ollama
      - nebula-graphd
    networks:
      - spx-network
    restart: unless-stopped
    deploy:
      replicas: 2

  # Celery Beat (定时任务)
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/spx_knowledge
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - spx-network
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - spx-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  opensearch_data:
  minio_data:
  ollama_data:
  nebula_metad_data:
  nebula_metad_logs:
  nebula_storaged_data:
  nebula_storaged_logs:
  nebula_graphd_logs:

networks:
  spx-network:
    driver: bridge
