# Docker Compose for Development

# version: '3.8'  # Docker Compose v2 不再需要 version 字段

services:
  # FastAPI应用
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/multikb_knowledge
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_NEBULA_GRAPH=true
      - NEBULA_HOSTS=nebula-graphd:9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
    volumes:
      - ../app:/app/app
      - ../scripts:/app/scripts
      - ../tests:/app/tests
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
      - opensearch
      - minio
      - ollama
      - nebula-graphd
    networks:
      - multikb-network

  # MySQL数据库
  mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=multikb_knowledge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - multikb-network

  # Redis缓存
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - multikb-network

  # OpenSearch搜索引擎
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - multikb-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - multikb-network

  # Ollama LLM服务
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - multikb-network

  # ============================================
  # NebulaGraph 图数据库服务
  # ============================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: multikb-knowledge-nebula-metad
    restart: always
    environment:
      - USER=root
    ports:
      - "9559:9559"
      - "19559:19559"
    volumes:
      - nebula_metad_data:/data/meta
      - nebula_metad_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    networks:
      - multikb-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9559' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: multikb-knowledge-nebula-storaged
    restart: always
    environment:
      - USER=root
    ports:
      - "9779:9779"
      - "19779:19779"
    volumes:
      - nebula_storaged_data:/data/storage
      - nebula_storaged_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      - nebula-metad
    networks:
      - multikb-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9779' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: multikb-knowledge-nebula-graphd
    restart: always
    environment:
      - USER=root
    ports:
      - "9669:9669"
      - "19669:19669"
    volumes:
      - nebula_graphd_logs:/logs
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=0.0.0.0
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      - nebula-metad
      - nebula-storaged
    networks:
      - multikb-network
    # 暂时禁用健康检查，让容器先启动
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9669' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/multikb_knowledge
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_NEBULA_GRAPH=true
      - NEBULA_HOSTS=nebula-graphd:9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
    volumes:
      - ../app:/app/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
      - opensearch
      - minio
      - ollama
      - nebula-graphd
    networks:
      - multikb-network

  # Celery Beat (定时任务)
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/multikb_knowledge
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../app:/app/app
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - multikb-network

volumes:
  mysql_data:
  redis_data:
  opensearch_data:
  minio_data:
  ollama_data:
  nebula_metad_data:
  nebula_metad_logs:
  nebula_storaged_data:
  nebula_storaged_logs:
  nebula_graphd_logs:

networks:
  multikb-network:
    driver: bridge
